schema_version: 1

context:
  version: "1.4.1"

package:
  name: sep
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/sep/sep-${{ version }}.tar.gz
  sha256: a0c8324ab66ee716080472cb212e4303e6c3e33b0d43763075b20d4cab793b25

build:
  number: 5
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - numpy
    - cython
  run:
    - python

tests:
  - python:
      imports:
        - sep
      pip_check: false

about:
  license: LGPL-3.0-or-later
  license_file: licenses/LGPL_LICENSE.txt
  summary: Astronomical source extraction and photometry library
  description: |
    SEP makes the core algorithms of Source Extractor available as a
    library of stand-alone functions and classes. These operate directly
    on in-memory arrays (no FITS files or configuration files). The code
    is derived from the Source Extractor code base (written in C) and aims
    to produce results compatible with Source Extractor whenever possible.
  homepage: https://github.com/sep-developers/sep
  repository: https://github.com/sep-developers/sep
  documentation: http://sep.readthedocs.io/

extra:
  recipe-maintainers:
    - kbarbary
    - mwcraig
    - beckermr
